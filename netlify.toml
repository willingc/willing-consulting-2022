## Netlify configuration for Quarto site
## The Quarto build outputs the static site to the `_site/` directory.
[build]
publish = "_site"

## Quarto plugin: installs Quarto and runs `quarto render` on every Netlify
## build (production on push to main, and Deploy Previews on pull requests).
## `version` is a quarto-cli GitHub release tag, so keep the leading "v".
## A QUARTO_VERSION environment variable in Netlify overrides this value.
[[plugins]]
package = "@quarto/netlify-plugin-quarto"
  [plugins.inputs]
  version = "v1.11.9"

## Response headers live in `_headers`, which Quarto copies into _site/
## (see `project: resources` in _quarto.yml).

## Lighthouse plugin: audits pages during the build and publishes HTML reports
## under /reports/ on every deploy (production and Deploy Previews).
##
## By default this plugin runs *after* the deploy is live (onSuccess) and
## discards output_path, so no report is ever published. Setting
## fail_deploy_on_score_thresholds = "true" makes it run in onPostBuild
## instead, which serves _site/ locally and can write reports into it.
## No thresholds are set, so low scores never fail the build.
##
## Note: these audits serve _site/ from a local static server, so Netlify's
## response headers (_headers) and CDN caching are not part of the scores.
[[plugins]]
package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
  fail_deploy_on_score_thresholds = "true"

  [[plugins.inputs.audits]]
  path = "index.html"
  output_path = "reports/lighthouse.html"

  [[plugins.inputs.audits]]
  path = "blog/index.html"
  output_path = "reports/blog.html"

  [[plugins.inputs.audits]]
  path = "blog/posts/2026-05-24_pycon_ai.html"
  output_path = "reports/blog-post.html"

  [[plugins.inputs.audits]]
  path = "contact.html"
  output_path = "reports/contact.html"
