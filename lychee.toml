# Link checker configuration for lychee, used by .github/workflows/links.yml.
#
# The workflow checks the *rendered* site, so .qmd links are verified the way
# visitors see them. To run the same check locally:
#
#   quarto render
#   lychee --root-dir "$PWD/_site" '_site/**/*.html'

# Resolve directory links like /blog/ to /blog/index.html
index_files = ["index.html"]

max_concurrency = 16
timeout = 20
max_retries = 2

# Treat rate limiting as success rather than a broken link
accept = ["100..=103", "200..=299", "429"]

exclude = [
  # Sites that block automated requests (403/999) but load fine in a browser
  '^https://www\.linkedin\.com/',
  '^https://www\.openhub\.net/',
  '^https://blog\.adafruit\.com/',
  '^https://blog\.djangogirls\.org/',
  '^https?://(www|shop)\.oreilly\.com/',
  '^http://findingada\.com/',
  # This site itself sits behind a Cloudflare bot challenge
  '^https://(www\.)?willingconsulting\.com/',
  # Form POST endpoint; a GET returns 405 by design
  '^https://formspree\.io/f/',
  # YouTube playlist embeds return 404 to non-browser clients
  '^https://www\.youtube\.com/embed/videoseries',
]
